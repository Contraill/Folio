name: CI

# Required for merging into main: types, unit tests, a real build with live GitHub data, checks on its output and
# the browser suite against it.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.18.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FOLIO_TRIGGER: ci
        run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - name: Check the build output
        run: node --test src/build.test.ts
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Browser suite
        run: pnpm test:e2e
