name: Preview

# A push to develop: checks, a build, the Preview deploy (develop-folio.<subdomain>.workers.dev, behind Cloudflare
# Access) and the smoke tests against it with the Access service token. Run by hand with "full", it runs the whole
# browser suite against the Preview instead, and the smoke tests in WebKit too.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      full:
        description: The whole browser suite, not only the smoke tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: preview-develop
  cancel-in-progress: true

jobs:
  preview:
    # A fixed image rather than ubuntu-latest: change it on purpose, with a test run.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Its secrets (the Preview's Cloudflare token, the Access service token) exist only in this environment, which only
    # develop may use. `wrangler preview` uploads a preview version, never a production deploy.
    environment: preview
    env:
      PREVIEW_URL: https://develop-folio.i-canoztozlu.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1; pnpm's version is packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Deploy the Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler preview --name develop
      - run: pnpm exec playwright install --with-deps chromium firefox ${{ inputs.full && 'webkit' || '' }}
      # A preflight first proves that the token reaches this commit's Preview; if not, nothing else runs.
      - name: Browser tests against the Preview
        env:
          BASE_URL: ${{ env.PREVIEW_URL }}
          FOLIO_EXPECTED_SHA: ${{ github.sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SUITE: ${{ inputs.full && 'test:e2e' || 'test:smoke' }}
          FOLIO_WEBKIT: ${{ inputs.full && '1' || '' }}
        run: pnpm $SUITE
      # Screenshots and errors only: no traces are recorded while the token is in use, and errors never print it.
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: preview-browser-report, path: playwright-report/, retention-days: 14, if-no-files-found: ignore }
