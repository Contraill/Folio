name: Production

# The only way to production. Merges into main, every six hours (fresh GitHub data on approved code) and the manual
# Refresh all run here, one at a time. GitHub may delay or skip scheduled runs; a failed build keeps the live version.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a waiting older run is dropped when a newer one arrives.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Production secrets exist only in this environment, which only main may use; the condition says the same in code,
    # so a manual run started from another branch does nothing.
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      # main as it is now, not the commit that queued this run.
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FOLIO_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}
        run: pnpm build
      - name: Check the build output
        run: node --test src/build.test.ts
      - name: Is this still the newest main?
        id: fresh
        run: |
          built=$(git rev-parse HEAD)
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$built" = "$head" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::main moved from ${built:0:7} to ${head:0:7} during this run; its own run deploys it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.fresh.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Production serves this build
        if: steps.fresh.outputs.deploy == 'true'
        run: node scripts/check-live.ts https://oztozlu.dev dist/_build.json
